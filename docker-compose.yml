services:
  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
    container_name: app-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3500
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: app_password
      PGSSLMODE: disable
    ports:
      - "3500:3500"

  adminer:
    image: adminer:4
    container_name: app-adminer
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    restart: always

volumes:
  pgdata:
